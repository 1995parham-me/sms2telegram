---
version: 2

builds:
  - main: ./cmd/sms2telegram
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/1995parham-me/sms2telegram/internal/cmd.version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - configs/config.example.toml
      - deployments/sms2telegram.service

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
