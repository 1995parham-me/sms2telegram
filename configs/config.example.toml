# Every key can also be set from the environment: SMS2TELEGRAM_ + the path in
# upper case with "__" between levels, e.g. SMS2TELEGRAM_TELEGRAM__TOKEN.

[modem]
# The dongle's web UI. Unisoc MiFi dongles hand out 192.168.0.0/24 over RNDIS.
url = "http://192.168.0.1"
timeout = "10s"

[telegram]
api_url = "https://api.telegram.org"
# From @BotFather.
token = ""
# Your user id (message the bot, then read getUpdates) or a group id.
chat_id = ""
timeout = "30s"

[forwarder]
interval = "30s"
# Telegram alert when the modem has been unreachable this long, and again when
# it is back. "0s" turns alerts off.
alert_after = "10m"
# Keys of the messages already delivered, so a restart sends nothing twice.
state_file = "/var/lib/sms2telegram/state.json"
# Delete messages from the modem once they are delivered, keeping the newest
# page (6 messages). A full inbox drops new SMS, and every pass reads less.
delete_forwarded = false

[webhook]
# Receive Alertmanager notifications here and text each one from the SIM, a
# fallback that needs no internet. Empty (the default) turns it off.
# listen = "192.168.1.10:9097"
# Alertmanager sends it with http_config.authorization (type Bearer).
token = ""
# Every number gets every notification, one 160-character SMS each.
to = []
# How long to wait for the modem to confirm each SMS.
timeout = "1m"
