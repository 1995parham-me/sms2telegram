# Every key can also be set from the environment: SMS2TELEGRAM_ + the path in
# upper case with "__" between levels, e.g. SMS2TELEGRAM_TELEGRAM__TOKEN.

[modem]
# The dongle's web UI. Unisoc MiFi dongles hand out 192.168.0.0/24 over RNDIS.
url = "http://192.168.0.1"
timeout = "10s"
# The zone of the modem's clock, which the dates of received messages are in
# (an IANA name such as "Asia/Tehran"). Empty is this machine's zone.
timezone = ""

[telegram]
api_url = "https://api.telegram.org"
# From @BotFather.
token = ""
# Your user id (message the bot, then read getUpdates) or a group id.
chat_id = ""
timeout = "30s"

[forwarder]
interval = "30s"
# Telegram alert when the modem has been unreachable this long, and again when
# it is back. "0s" turns alerts off.
alert_after = "10m"
# Keys of the messages already delivered, so a restart sends nothing twice.
state_file = "/var/lib/sms2telegram/state.json"
# Delete messages from the modem once they are delivered, keeping the newest
# page (6 messages). A full inbox drops new SMS, and every pass reads less.
delete_forwarded = false

[webhook]
# Receive Alertmanager notifications at /alertmanager on the [server] listener
# and text each one from the SIM, a fallback that needs no internet. It is on
# once it has a token. (listen here is where the listener was set before
# 0.7.0, and still works.)
# Alertmanager sends it with http_config.authorization (type Bearer).
token = ""
# Every number gets every notification, one 160-character SMS each.
to = []
# How long to wait for the modem to confirm each SMS.
timeout = "1m"

[heartbeat]
# The SIM's own number. serve texts it every interval and alerts on Telegram
# when the message has not come back within wait: the only check that proves
# SMS still arrive. Empty (the default) turns it off.
number = ""
interval = "12h"
wait = "15m"
# How long to wait for the modem to confirm the send.
timeout = "2m"
# Defaults to heartbeat.json beside state_file.
file = ""

[contacts]
# A CardDAV address book (the collection URL, ending in "/") to name senders
# from: "Ali (+98912...)" instead of the bare number. Read-only; the names are
# cached, so they survive the server being down. Empty (the default) turns it off.
url = ""
username = ""
password = ""
# Calling code national numbers (0912...) are read in.
country = "98"
# How often to check for changes; a full read happens only when the address
# book's change tag moves.
refresh = "15m"
timeout = "2m"
# Defaults to contacts.json beside state_file.
file = ""

[server]
# The one HTTP listener: the web UI at /, MCP at /mcp, the Alertmanager
# webhook at /alertmanager and the metrics at /metrics. It has no TLS, so bind
# it to a private address. Empty falls back to webhook.listen; with both empty
# nothing is served.
listen = ""
# Reverse proxies whose X-Real-IP and X-Forwarded-Proto headers are believed.
trusted_proxies = []

[ui]
# How long a login lasts.
session_ttl = "720h"
# The key that signs sessions, created when missing. Defaults to session.key
# beside state_file.
secret_file = ""

# The web UI is on once it has a user: a name and the bcrypt hash of its
# password, from `sms2telegram hash-password`.
# [ui.users]
# parham = "$2a$10$..."

# The MCP endpoint is on once it has a token: a name and the SHA-256 of the
# token, from `sms2telegram mcp-token <name>`.
# [mcp.tokens]
# claude = "..."

[send]
# What the web UI and MCP may send: SMS in any 24 hours (0 is no limit; alerts
# and heartbeats never count) and the longest message in SMS parts.
daily_limit = 30
max_parts = 4
# How long to wait for the modem to confirm a send or answer a USSD code.
timeout = "1m"

[archive]
# The history of received and sent messages, one JSON object per line.
# Defaults to messages.jsonl beside state_file.
file = ""
